<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEC CONSULTING - Asesoría en Comercio Internacional y Logística</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        :root {
            --primary-dark: #1c3d5a;
            --primary-blue: #0d6efd;
            --light-bg: #f8f9fa;
            --text-dark: #343a40;
            --text-light: #6c757d;
            --white: #ffffff;
            --border-color: #e9ecef;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            margin: 0;
            display: flex;
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.7;
        }

        .sidebar {
            width: 300px;
            background-color: var(--primary-dark);
            color: var(--white);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 25px;
            text-align: center;
            background-color: #112639;
        }
        .sidebar-header img {
            max-width: 95%;
            height: auto;
        }
        
        .sidebar-nav {
            flex-grow: 1;
            padding-top: 20px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--white);
            text-decoration: none;
            padding: 18px 30px;
            font-size: 1.1em;
            font-weight: 500;
            border-left: 4px solid transparent;
            transition: background-color 0.3s, border-left 0.3s;
        }
        .sidebar-nav a:hover {
            background-color: #2c5b8a;
            border-left: 4px solid var(--primary-blue);
        }
        
        .contact-sidebar {
            padding: 20px 30px;
            border-top: 1px solid #4a6a8a;
            font-size: 0.9em;
        }
        .contact-sidebar h3 {
            margin: 0 0 15px 0;
            opacity: 0.9;
            font-weight: 700;
            color: var(--white);
        }
        .contact-sidebar p {
            margin: 10px 0;
            word-wrap: break-word;
        }
        .contact-sidebar a {
            color: #aed6f1;
            text-decoration: none;
            transition: color 0.2s;
        }
        .contact-sidebar a:hover {
            color: var(--white);
            text-decoration: underline;
        }

        .main-content { 
            margin-left: 300px; 
            padding: 40px; 
            width: calc(100% - 300px); 
        }
        
        .header { 
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-blue)); 
            color: var(--white); 
            padding: 60px 50px; 
            border-radius: 12px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
            margin-bottom: 40px; 
        }
        .header h1 { 
            margin: 0; 
            font-size: 3.5em; 
            font-weight: 700; 
        }
        .header .subtitle { 
            font-size: 1.7em; 
            opacity: 0.9; 
            margin-top: 10px; 
            font-weight: 300; 
        }
        
        .card { 
            background-color: var(--white); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.07); 
            margin-bottom: 40px; 
        }
        .card h2 { 
            font-size: 2.2em; 
            color: var(--primary-dark); 
            border-bottom: 4px solid var(--primary-blue); 
            padding-bottom: 15px; 
            margin-top: 0; 
            margin-bottom: 30px; 
        }
        
        .services-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; 
        }
        .service-card { 
            background-color: var(--light-bg); 
            padding: 30px; 
            border-radius: 10px; 
            border: 1px solid var(--border-color); 
            border-left: 6px solid var(--primary-blue); 
            transition: transform 0.3s, box-shadow 0.3s; 
        }
        .service-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        .service-card h4 { 
            margin-top: 0; 
            margin-bottom: 10px; 
            font-size: 1.4em; 
            color: var(--primary-dark); 
        }
        
        .skills-list {
            list-style: none;
            padding: 0;
            columns: 2;
            column-gap: 40px;
        }
        .skills-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 1.1em;
            font-weight: 500;
        }
        .skills-list .icon {
            color: #198754;
            font-size: 1.4em;
        }

        .timeline { 
            position: relative; 
            list-style: none; 
            padding: 10px 0 0 0; 
        }
        .timeline::before { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 10px; 
            height: 100%; 
            width: 4px; 
            background: var(--border-color);
            border-radius: 2px;
        }
        .timeline-item { 
            position: relative; 
            margin-bottom: 35px; 
            padding-left: 45px; 
        }
        .timeline-item::before { 
            content: ''; 
            position: absolute; 
            left: 0px; 
            top: 5px; 
            height: 24px; 
            width: 24px; 
            background: var(--primary-blue); 
            border-radius: 50%; 
            border: 4px solid var(--white); 
            z-index: 1;
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.5);
        }
        .timeline-item strong { 
            display: block; 
            font-size: 1.4em; 
            color: var(--primary-dark);
            font-weight: 700;
        }
        .timeline-item .company {
            font-weight: 500;
            font-size: 1.1em;
        }
        .timeline-item .date { 
            display: block;
            font-size: 1em; 
            color: var(--text-light);
            margin: 4px 0 10px 0;
        }
        .timeline-item p {
            margin: 0;
            font-size: 1.05em;
            color: var(--text-dark);
        }

        .education-list .education-item {
            margin-bottom: 20px;
        }
        .education-item strong {
            display: block;
            font-size: 1.2em;
            color: var(--primary-dark);
        }
        .education-item span {
            color: var(--text-light);
        }


        footer { 
            text-align: center; 
            margin-top: 50px; 
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-light); 
            font-size: 0.95em; 
        }
    </style>
</head>
